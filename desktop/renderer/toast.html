<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Auto-tracking</title>
    <style>
      /* Zero-click tracking notice: what just started (and what was saved), with
         Undo. Closes itself after a few seconds; hovering keeps it open. */
      html, body { margin: 0; height: 100%; }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #0b0b12;
        color: #e2e8f0;
        border: 1px solid rgba(139, 92, 246, 0.35);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px 0 14px;
        box-sizing: border-box;
        user-select: none;
        -webkit-app-region: drag;
      }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; flex: none; box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.18); }
      .text { flex: 1; min-width: 0; }
      .main { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .key { font-family: ui-monospace, Consolas, monospace; color: #c4b5fd; }
      .sub { font-size: 12px; color: #94a3b8; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      button {
        -webkit-app-region: no-drag;
        padding: 7px 12px; border-radius: 8px; border: 1px solid rgba(139, 92, 246, 0.4);
        background: rgba(139, 92, 246, 0.18); color: #c4b5fd;
        font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
      }
      button:hover { background: rgba(139, 92, 246, 0.3); }
      button:disabled { opacity: 0.6; cursor: default; }
      #x { border: 0; background: transparent; color: #64748b; font-size: 16px; padding: 4px 6px; }
      #x:hover { color: #e2e8f0; background: rgba(255, 255, 255, 0.06); }
    </style>
  </head>
  <body>
    <span class="dot"></span>
    <div class="text">
      <div class="main" id="main">Auto-tracking</div>
      <div class="sub" id="sub"></div>
    </div>
    <button id="undo">Undo</button>
    <button id="x" title="Dismiss">&times;</button>

    <script>
      const CLOSE_AFTER_MS = 15000;
      let closeTimer = null;
      let hovering = false;

      function fmt(sec) {
        sec = Math.max(0, Math.floor(sec || 0));
        const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
        return h ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}m`;
      }

      function scheduleClose() {
        clearTimeout(closeTimer);
        closeTimer = setTimeout(() => { if (!hovering) window.desktop.toastClose(); else scheduleClose(); }, CLOSE_AFTER_MS);
      }

      async function load() {
        const p = await window.desktop.toastGet();
        if (!p) return window.desktop.toastClose();
        const main = document.getElementById("main");
        main.replaceChildren("Tracking ", Object.assign(document.createElement("span"), { className: "key", textContent: p.issue_key }), " automatically");
        document.getElementById("sub").textContent = p.previous
          ? `Saved ${p.previous.issue_key || "previous session"} (${fmt(p.previous.seconds)})`
          : "You've been on it for 5 minutes";
        const undo = document.getElementById("undo");
        undo.disabled = false;
        undo.textContent = "Undo";
        scheduleClose();
      }

      document.getElementById("undo").addEventListener("click", async () => {
        const undo = document.getElementById("undo");
        undo.disabled = true;
        const res = await window.desktop.toastUndo();
        document.getElementById("main").textContent = res && res.ok ? "Auto-tracking undone" : "Nothing to undo";
        document.getElementById("sub").textContent = res && res.message ? res.message : "";
        undo.textContent = "Done";
        clearTimeout(closeTimer);
        closeTimer = setTimeout(() => window.desktop.toastClose(), 4000);
      });
      document.getElementById("x").addEventListener("click", () => window.desktop.toastClose());
      document.body.addEventListener("mouseenter", () => { hovering = true; });
      document.body.addEventListener("mouseleave", () => { hovering = false; });
      window.desktop.onToastUpdate(load);
      load();
    </script>
  </body>
</html>
