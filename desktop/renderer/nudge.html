<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Check in</title>
    <style>
      /* A compact corner card: one status line + quick buttons, shown
         instantly with no AI round-trip. Typing a reply grows it into a chat
         with the assistant (main process resizes the window upward). */
      html, body { margin: 0; height: 100%; }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #0b0b12;
        color: #e2e8f0;
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(139, 92, 246, 0.25);
        border-radius: 12px;
        overflow: hidden;
        user-select: none;
      }
      #bar {
        -webkit-app-region: drag;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 30px;
        padding: 0 6px 0 12px;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #94a3b8;
      }
      #bar .logo {
        width: 12px; height: 12px; border-radius: 4px;
        background: linear-gradient(135deg, #8b5cf6, #6366f1);
      }
      #bar .grow { flex: 1; }
      #close {
        -webkit-app-region: no-drag;
        width: 24px; height: 24px; padding: 0;
        border: 0; border-radius: 6px;
        background: transparent; color: #64748b;
        font-size: 16px; line-height: 24px; cursor: pointer;
      }
      #close:hover { background: rgba(255, 255, 255, 0.08); color: #e2e8f0; }
      #headline {
        padding: 2px 14px 12px;
        font-size: 14px;
        line-height: 1.4;
        font-weight: 600;
      }
      #headline .sub { display: block; margin-top: 2px; font-size: 12px; font-weight: 400; color: #94a3b8; }
      #msgs {
        flex: 1;
        overflow-y: auto;
        padding: 0 14px 10px;
        display: none;
        flex-direction: column;
        gap: 8px;
        user-select: text;
      }
      body.chat #msgs { display: flex; }
      .bubble {
        max-width: 86%;
        padding: 8px 11px;
        border-radius: 14px;
        font-size: 13px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .assistant { align-self: flex-start; background: rgba(255, 255, 255, 0.06); color: #e2e8f0; }
      .user { align-self: flex-end; background: #7c3aed; color: #fff; }
      .system { align-self: flex-start; background: rgba(16, 185, 129, 0.12); color: #6ee7b7; font-size: 12px; }
      .action {
        align-self: flex-start;
        max-width: 92%;
        border: 1px solid rgba(139, 92, 246, 0.35);
        border-radius: 12px;
        padding: 10px;
        background: rgba(139, 92, 246, 0.08);
      }
      .action .sum { font-size: 12.5px; color: #ddd6fe; margin-bottom: 8px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      #quick { padding: 0 14px 10px; }
      button {
        padding: 7px 12px;
        border-radius: 8px;
        border: 1px solid transparent;
        font: inherit;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      .primary { background: rgba(139, 92, 246, 0.18); color: #c4b5fd; border-color: rgba(139, 92, 246, 0.4); }
      .primary:hover { background: rgba(139, 92, 246, 0.28); }
      .ghost { background: transparent; border-color: #334155; color: #cbd5e1; }
      .ghost:hover { background: rgba(255, 255, 255, 0.06); }
      #composer {
        display: flex; gap: 8px; align-items: flex-end;
        padding: 8px 12px 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }
      textarea {
        flex: 1;
        resize: none;
        max-height: 90px;
        min-height: 18px;
        background: #0f1424;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        color: #e2e8f0;
        font: inherit;
        font-size: 13px;
        padding: 7px 10px;
      }
      textarea:focus { outline: none; border-color: #8b5cf6; }
      .send { padding: 7px 11px; }
    </style>
  </head>
  <body>
    <div id="bar">
      <span class="logo"></span><span class="grow">Check-in</span>
      <button id="close" title="Dismiss">&times;</button>
    </div>

    <div id="headline">Checking in&hellip;</div>
    <div id="quick"></div>
    <div id="msgs"></div>

    <div id="composer">
      <textarea id="reply" rows="1" placeholder="Or tell me what you're doing..."></textarea>
      <button class="primary send" id="sendBtn" title="Send">&#10148;</button>
    </div>

    <script>
      const headline = document.getElementById("headline");
      const msgs = document.getElementById("msgs");
      const quick = document.getElementById("quick");
      const replyEl = document.getElementById("reply");

      // Assistant history; the first turn gives it the check-in context.
      const history = [];
      let status = null;

      function fmtElapsed(sec) {
        sec = Math.max(0, Math.floor(sec || 0));
        const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
        return h ? `${h}h ${m}m` : `${m}m`;
      }

      function setHeadline(main, sub) {
        headline.textContent = main;
        if (sub) {
          const s = document.createElement("span");
          s.className = "sub";
          s.textContent = sub;
          headline.appendChild(s);
        }
      }

      function btn(label, cls, onClick) {
        const b = document.createElement("button");
        b.textContent = label;
        b.className = cls;
        b.addEventListener("click", onClick);
        return b;
      }

      function bubble(role, text) {
        const el = document.createElement("div");
        el.className = "bubble " + role;
        el.textContent = text;
        msgs.appendChild(el);
        msgs.scrollTop = msgs.scrollHeight;
        return el;
      }

      function renderAction(action) {
        const wrap = document.createElement("div");
        wrap.className = "action";
        const sum = document.createElement("div");
        sum.className = "sum";
        sum.textContent = action.summary;
        const row = document.createElement("div");
        row.className = "row";
        const confirm = btn("Confirm", "primary", async () => {
          confirm.disabled = true;
          confirm.textContent = "Working...";
          let result;
          try {
            result = await window.desktop.assistantAct(action);
          } catch (e) {
            result = "Could not complete that.";
          }
          wrap.remove();
          bubble("system", result || "Done.");
        });
        row.appendChild(confirm);
        row.appendChild(btn("Cancel", "ghost", () => wrap.remove()));
        wrap.appendChild(sum);
        wrap.appendChild(row);
        msgs.appendChild(wrap);
        msgs.scrollTop = msgs.scrollHeight;
      }

      // Instant, no-AI content from the current status.
      async function init() {
        try {
          status = await window.desktop.getStatus();
        } catch (e) {
          status = null;
        }
        const s = status && status.session;
        const row = document.createElement("div");
        row.className = "row";
        if (s) {
          const what = s.issue_key || s.description || "this task";
          const paused = s.state === "paused";
          setHeadline(
            paused ? `Paused on ${what}` : `Still on ${what}?`,
            `${fmtElapsed(s.elapsed_seconds)} tracked` + (s.issue_key && s.description ? ` · ${s.description}` : ""),
          );
          row.appendChild(btn(paused ? "Keep paused" : "Yes, still on it", "primary", () => window.desktop.answerCheckin()));
          row.appendChild(
            btn("Switch", "ghost", async () => {
              await window.desktop.openApp();
              window.desktop.answerCheckin();
            }),
          );
        } else {
          const plan = status && status.intention && status.intention.note;
          setHeadline("No timer running", plan ? `Today's plan: ${plan.split("\n")[0]}` : "What are you working on?");
          row.appendChild(
            btn("Start tracking", "primary", async () => {
              await window.desktop.openApp();
              window.desktop.answerCheckin();
            }),
          );
        }
        row.appendChild(btn("Snooze 10m", "ghost", () => window.desktop.snoozeNudge()));
        quick.appendChild(row);
      }

      async function sendReply() {
        const text = replyEl.value.trim();
        if (!text) return;
        replyEl.value = "";
        if (!document.body.classList.contains("chat")) {
          document.body.classList.add("chat");
          await window.desktop.expandNudge();
          history.push({
            role: "user",
            content: "(Context: I'm answering my scheduled check-in from the desktop app. Keep replies short.)",
          });
        }
        bubble("user", text);
        history.push({ role: "user", content: text });
        const typing = bubble("assistant", "...");
        let res = null;
        try {
          res = await window.desktop.assistantChat(history);
        } catch (e) {
          res = null;
        }
        typing.remove();
        if (res && res.reply) {
          bubble("assistant", res.reply);
          if (res.used_ai) history.push({ role: "assistant", content: res.reply });
          if (res.action) renderAction(res.action);
        } else {
          bubble("assistant", "I couldn't reach the assistant. Use the buttons above.");
        }
      }

      document.getElementById("close").addEventListener("click", () => window.desktop.dismissNudge());
      document.getElementById("sendBtn").addEventListener("click", sendReply);
      replyEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendReply();
        }
        if (e.key === "Escape") window.desktop.dismissNudge();
      });

      init();
    </script>
  </body>
</html>
