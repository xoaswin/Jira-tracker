<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Check in</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        display: flex;
        flex-direction: column;
        border: 1px solid #1e293b;
        border-radius: 12px;
        overflow: hidden;
        user-select: none;
      }
      #bar {
        -webkit-app-region: drag;
        height: 30px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #64748b;
        border-bottom: 1px solid #1e293b;
      }
      main { padding: 16px 20px 20px; flex: 1; display: flex; flex-direction: column; }
      h1 { font-size: 17px; margin: 0 0 6px; }
      p { font-size: 13px; color: #cbd5e1; margin: 0 0 12px; line-height: 1.45; }
      .key { font-family: "Cascadia Code", ui-monospace, monospace; font-weight: 600; color: #a5b4fc; }
      .plan {
        font-size: 12px;
        color: #94a3b8;
        background: #111c33;
        border: 1px solid #1e293b;
        border-radius: 8px;
        padding: 8px 10px;
        margin: 0 0 12px;
        max-height: 66px;
        overflow: auto;
        white-space: pre-wrap;
      }
      .plan b { color: #cbd5e1; font-weight: 600; }
      textarea {
        width: 100%;
        box-sizing: border-box;
        resize: none;
        background: #0b1424;
        border: 1px solid #1e293b;
        border-radius: 8px;
        color: #e2e8f0;
        font: inherit;
        font-size: 13px;
        padding: 8px 10px;
        margin: 0 0 12px;
      }
      textarea:focus { outline: none; border-color: #6366f1; }
      .row { display: flex; gap: 8px; margin-top: auto; flex-wrap: wrap; }
      button {
        -webkit-app-region: no-drag;
        flex: 1;
        min-width: 120px;
        padding: 9px 12px;
        border-radius: 8px;
        border: 1px solid transparent;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .primary { background: #6366f1; color: #fff; }
      .primary:hover { background: #4f46e5; }
      .ghost { background: transparent; border-color: #334155; color: #cbd5e1; }
      .ghost:hover { background: #1e293b; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="bar">Jira Tracker &middot; check-in</div>
    <main>
      <h1 id="title">Checking in…</h1>
      <p id="body"></p>
      <div id="plan" class="plan hidden"></div>
      <textarea id="note" class="hidden" rows="2" placeholder="What are you working on? (saved as today's note)"></textarea>
      <div class="row" id="buttons"></div>
    </main>

    <script>
      const titleEl = document.getElementById("title");
      const bodyEl = document.getElementById("body");
      const planEl = document.getElementById("plan");
      const noteEl = document.getElementById("note");
      const buttons = document.getElementById("buttons");

      function btn(label, cls, onClick) {
        const b = document.createElement("button");
        b.textContent = label;
        b.className = cls;
        b.addEventListener("click", onClick);
        return b;
      }

      function showPlan(intention) {
        if (intention && (intention.note || (intention.ticket_keys || []).length)) {
          const keys = (intention.ticket_keys || []).join(", ");
          planEl.innerHTML =
            "<b>Today's plan:</b> " +
            (intention.note ? escapeHtml(intention.note) : "") +
            (keys ? " [" + escapeHtml(keys) + "]" : "");
          planEl.classList.remove("hidden");
        }
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
      }

      async function init() {
        let status;
        try {
          status = await window.desktop.getStatus();
        } catch (e) {
          status = null;
        }
        const session = status && status.session;
        showPlan(status && status.intention);

        if (session) {
          const key = session.issue_key || session.description || "this session";
          titleEl.textContent = "Still on this?";
          bodyEl.innerHTML =
            "You're tracking <span class='key'>" +
            escapeHtml(key) +
            "</span>" +
            (session.issue_key && session.description ? " &mdash; " + escapeHtml(session.description) : "") +
            ". Is that still what you're working on?";
          buttons.appendChild(
            btn("Yes, still on it", "primary", () => window.desktop.answerCheckin()),
          );
          buttons.appendChild(
            btn("Switch task", "ghost", async () => {
              await window.desktop.openApp();
              window.desktop.answerCheckin();
            }),
          );
        } else {
          titleEl.textContent = "What are you working on?";
          bodyEl.textContent =
            "No timer is running. Start tracking, or jot it down so the time isn't lost.";
          noteEl.classList.remove("hidden");
          noteEl.focus();
          buttons.appendChild(
            btn("Start tracking", "primary", async () => {
              await window.desktop.openApp();
              window.desktop.answerCheckin();
            }),
          );
          buttons.appendChild(
            btn("Save note", "ghost", async () => {
              const text = noteEl.value.trim();
              if (text) await window.desktop.appendNote(text);
              window.desktop.answerCheckin();
            }),
          );
          buttons.appendChild(btn("Snooze", "ghost", () => window.desktop.snoozeNudge()));
        }
      }

      init();
    </script>
  </body>
</html>
